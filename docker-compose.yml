services:
  db:
    image: postgres:16-alpine
    container_name: perfilpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: perfilpro
    ports:
      - "5432:5432"
    volumes:
      - perfilpro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  perfilpro-db-data:
